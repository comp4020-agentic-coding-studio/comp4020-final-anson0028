<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Walk</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">Walk</a>
      <nav aria-label="site">
        <a href="/" aria-current="page">Island</a>
        <a href="/readme/">About</a>
      </nav>
      <span id="who" class="who" aria-live="polite"></span>
    </header>
    <main>
      <h1 class="sr-only">Walk</h1>
      <canvas id="view" role="application" aria-label="The island. Arrow keys or WASD to walk." tabindex="0"></canvas>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="code" class="code" hidden></div>
      <aside id="sign" class="sign" aria-label="Gate log" hidden></aside>
      <form id="say" class="say" autocomplete="off">
        <label for="text" class="sr-only">Say something to people near you</label>
        <input id="text" name="text" maxlength="40" placeholder="Say something (Enter)" />
        <button type="submit">Say</button>
      </form>
      <form id="keypad" class="keypad" autocomplete="off" hidden>
        <label for="digits">Keypad</label>
        <input id="digits" name="digits" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" placeholder="000" />
        <button type="submit">Enter</button>
      </form>
      <div class="pad" aria-label="Walk">
        <button type="button" data-dir="0,-1" aria-label="Up">▲</button>
        <button type="button" data-dir="-1,0" aria-label="Left">◀</button>
        <button type="button" data-dir="1,0" aria-label="Right">▶</button>
        <button type="button" data-dir="0,1" aria-label="Down">▼</button>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
